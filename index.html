<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <!-- Tiêu đề theo yêu cầu -->
    <h1>Danh sách sản phẩm</h1>

    <!-- Bảng sản phẩm -->
    <table>
        <!-- Hàng tiêu đề các cột -->
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>
        <!-- Tối thiểu 4 sản phẩm -->
        <tr>
            <td>Bàn phím cơ AKKO</td>
            <td>1.250.000 VNĐ</td>
            <td>15</td>
        </tr>
        <tr>
            <td>Chuột không dây Logitech</td>
            <td>450.000 VNĐ</td>
            <td>30</td>
        </tr>
        <tr>
            <td>Tai nghe Sony WH-1000XM4</td>
            <td>5.490.000 VNĐ</td>
            <td>8</td>
        </tr>
        <tr>
            <td>Lót chuột cỡ lớn</td>
            <td>120.000 VNĐ</td>
            <td>50</td>
        </tr>
    </table>

</body>
</html>
